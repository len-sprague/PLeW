<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - PLeW</title>
    <meta name="description" content="{{ .Description }}">
    <style>
        /* Same palette as the tool and the examples gallery. */
        :root {
            --bg: #0f1419;
            --panel: #1a1f26;
            --panel-2: #232a33;
            --line: #2d3640;
            --text: #e8e8e8;
            --muted: #8899a6;
            --accent: #4ecdc4;
            --warn: #ffd93d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 72px; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            font-size: 16px;
        }
        a { color: var(--accent); }

        /* ---- Top bar ---- */
        .doc-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 20px;
            padding: 12px 24px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }
        .doc-nav .brand {
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            margin-right: 8px;
        }
        .doc-nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }
        .doc-nav a:hover { color: var(--accent); }
        .doc-nav a.current { color: var(--text); border-bottom-color: var(--accent); }
        .doc-nav .spacer { flex: 1; }

        /* ---- Page frame: contents list + text ---- */
        .doc-frame {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 40px;
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }
        .doc-toc {
            position: sticky;
            top: 72px;
            align-self: start;
            max-height: calc(100vh - 96px);
            overflow-y: auto;
            font-size: 13px;
            padding-right: 8px;
        }
        .doc-toc-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .doc-toc ul { list-style: none; }
        .doc-toc ul ul { padding-left: 14px; }
        .doc-toc li { margin: 4px 0; }
        .doc-toc a { color: var(--muted); text-decoration: none; }
        .doc-toc a:hover { color: var(--accent); }
        /* The page's own H1 is the first entry; show only what is under it. */
        .doc-toc nav > ul > li > a { display: none; }
        .doc-toc nav > ul > li > ul { padding-left: 0; }

        /* ---- The document text ---- */
        .doc-body { min-width: 0; max-width: 820px; }
        .doc-body h1 { font-size: 30px; line-height: 1.25; margin-bottom: 16px; }
        .doc-body h2 {
            font-size: 22px;
            margin: 44px 0 12px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }
        .doc-body h3 { font-size: 17px; margin: 28px 0 8px; color: var(--accent); }
        .doc-body h4 { font-size: 15px; margin: 20px 0 6px; }
        .doc-body p, .doc-body ul, .doc-body ol, .doc-body table,
        .doc-body pre, .doc-body blockquote { margin-bottom: 14px; }
        .doc-body ul, .doc-body ol { padding-left: 24px; }
        .doc-body li { margin: 4px 0; }
        .doc-body li > ul, .doc-body li > ol { margin-bottom: 0; }
        .doc-body hr { border: 0; height: 0; margin: 0; }
        .doc-body strong { color: #fff; }
        .doc-body code {
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            font-size: 0.86em;
            background: var(--panel-2);
            padding: 1px 5px;
            border-radius: 4px;
            overflow-wrap: anywhere;
        }
        .doc-body pre {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px 16px;
            overflow-x: auto;
            line-height: 1.45;
        }
        .doc-body pre code { background: none; padding: 0; font-size: 13px; overflow-wrap: normal; }
        .doc-body table {
            display: block;
            overflow-x: auto;
            border-collapse: collapse;
            font-size: 14px;
            line-height: 1.5;
        }
        .doc-body th, .doc-body td {
            border: 1px solid var(--line);
            padding: 7px 11px;
            text-align: left;
            vertical-align: top;
        }
        .doc-body th { background: var(--panel); color: var(--accent); font-weight: 600; white-space: nowrap; }
        .doc-body blockquote {
            border-left: 3px solid var(--warn);
            background: var(--panel);
            padding: 10px 16px;
            border-radius: 0 6px 6px 0;
        }
        .doc-body blockquote p:last-child { margin-bottom: 0; }
        .doc-body input[type="checkbox"] { margin-right: 6px; }
        .doc-body li:has(> input[type="checkbox"]) { list-style: none; margin-left: -22px; }

        .doc-footer {
            margin-top: 56px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
        }

        @media (max-width: 900px) {
            .doc-frame { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 20px 16px 60px; }
            .doc-toc {
                position: static;
                max-height: none;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 12px 14px;
            }
            .doc-nav { padding: 10px 16px; }
            .doc-nav .spacer { display: none; }
            html { scroll-padding-top: 16px; }
            .doc-nav { position: static; }
        }
    </style>
</head>
<body>
    <header class="doc-nav">
        <a class="brand" href="{{ "/" | relURL }}">📊 PLeW</a>
        {{ $current := . }}
        {{ range where site.RegularPages "Layout" "doc" }}
        <a href="{{ .RelPermalink }}"{{ if eq . $current }} class="current" aria-current="page"{{ end }}>{{ .Title }}</a>
        {{ end }}
        <span class="spacer"></span>
        <a href="{{ "/" | relURL }}">Open the editor</a>
        <a href="{{ "examples/" | relURL }}">Examples</a>
    </header>

    <div class="doc-frame">
        <aside class="doc-toc" aria-label="On this page">
            <div class="doc-toc-title">On this page</div>
            {{ .TableOfContents }}
        </aside>

        <main class="doc-body">
            {{ .Content }}

            <footer class="doc-footer">
                This page is built from
                <a href="{{ site.Params.repoURL }}/blob/main/{{ .Params.source }}" target="_blank" rel="noopener"><code>{{ .Params.source }}</code></a>
                in the PLeW repository. To change it, edit that file.
            </footer>
        </main>
    </div>
</body>
</html>
